<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Smart Parking — ตรวจจับรถและจำนวนช่องว่าง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#E7E4D9;--card:#F9F7F0;--ink:#1C1E1B;--ink2:#5B5F5A;--ink3:#8B8F87;--line:#D6D2C3;
  --clay:#E2A61C;--clayInk:#1C1E1B;--sage:#1AA179;--busy:#DE4F42;--warn:#D97C1F;
  --asphalt:#24262A;--paint:rgba(233,229,214,.4);--onLot:#E9E5D6;
  --shadow:0 1px 2px rgba(20,18,10,.07),0 14px 30px -18px rgba(20,18,10,.32);
  --stripe:repeating-linear-gradient(135deg,var(--clay) 0 10px,#1C1E1B 10px 20px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111315;--card:#1B1E20;--ink:#ECEAE0;--ink2:#9A9F9C;--ink3:#686E6B;--line:#2A2D2F;
  --clay:#F0C23F;--clayInk:#14100A;--sage:#2FD498;--busy:#FF6259;--warn:#FFA84A;--asphalt:#08090A;--paint:rgba(236,234,224,.32);
  --shadow:0 1px 2px rgba(0,0,0,.5),0 16px 34px -18px rgba(0,0,0,.8);
  --stripe:repeating-linear-gradient(135deg,var(--clay) 0 10px,#08090A 10px 20px);}}
:root[data-theme="dark"]{
  --bg:#111315;--card:#1B1E20;--ink:#ECEAE0;--ink2:#9A9F9C;--ink3:#686E6B;--line:#2A2D2F;
  --clay:#F0C23F;--clayInk:#14100A;--sage:#2FD498;--busy:#FF6259;--warn:#FFA84A;--asphalt:#08090A;--paint:rgba(236,234,224,.32);
  --shadow:0 1px 2px rgba(0,0,0,.5),0 16px 34px -18px rgba(0,0,0,.8);
  --stripe:repeating-linear-gradient(135deg,var(--clay) 0 10px,#08090A 10px 20px);}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;font-family:'Noto Sans Thai',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--clay);outline-offset:2px}
.serif{font-weight:800;letter-spacing:-.01em}
.wrap{max-width:1360px;margin:0 auto;padding:clamp(16px,3vw,22px) clamp(14px,4vw,20px) 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0}
.mark{flex:none;width:38px;height:38px;border-radius:10px;background:var(--asphalt);display:grid;place-items:center;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.mark::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--stripe)}
.mark svg{width:20px;height:20px;color:var(--clay);position:relative}
.brandtext{min-width:0}
h1{margin:0;font-size:clamp(20px,2.6vw,28px);line-height:1.25}
.brand p{margin:0;font-size:13.5px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hazard{height:3px;border-radius:99px;background:var(--stripe);opacity:.55;margin:0 0 18px}
.field{position:relative;flex:1 1 240px;min-width:0;max-width:340px}
.field input{width:100%;height:42px;padding:0 14px 0 38px;border-radius:12px;border:1px solid var(--line);background:var(--card);transition:border-color .2s,box-shadow .2s}
.field input:focus{outline:none;border-color:var(--clay);box-shadow:0 0 0 3px color-mix(in srgb,var(--clay) 24%,transparent)}
.field svg{position:absolute;left:12px;top:12px;width:18px;height:18px;color:var(--ink3)}
.btn{height:42px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;display:flex;align-items:center;gap:8px;flex:none;transition:transform .15s cubic-bezier(.3,1.4,.5,1),border-color .2s}
.btn:hover{border-color:var(--ink3)}
.btn:active{transform:scale(.96)}
.dot{width:8px;height:8px;border-radius:99px;background:var(--ink3);flex:none}
.dot.on{background:var(--sage);box-shadow:0 0 0 0 color-mix(in srgb,var(--sage) 60%,transparent);animation:ping 2.4s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--sage) 45%,transparent)}70%{box-shadow:0 0 0 6px color-mix(in srgb,var(--sage) 0%,transparent)}100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--sage) 0%,transparent)}}
.livewire{transition:x1 .95s linear,y1 .95s linear,x2 .95s linear,y2 .95s linear}
.livept{transition:cx .95s linear,cy .95s linear}
.livept:first-of-type{animation:livepulse 1.9s ease-out infinite}
@keyframes livepulse{0%{r:5;opacity:.35}70%{r:14;opacity:0}100%{r:14;opacity:0}}
@keyframes blink{50%{opacity:.3}}
.pulse{animation:livepulse 1.9s ease-out infinite}
@keyframes flicker{0%,100%{opacity:1}4%{opacity:.4}8%{opacity:1}9%{opacity:.5}12%{opacity:1}}
.top{animation:flicker .9s ease-out both}
@media(max-width:560px){.top{gap:10px}.field{flex-basis:100%;max-width:none;order:3}.btn{flex:1 1 auto;justify-content:center}}
.seg{position:relative;display:grid;width:min(100%,300px);grid-template-columns:repeat(2,1fr);padding:4px;border-radius:14px;background:color-mix(in srgb,var(--ink) 7%,transparent)}
.seg i{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/2);border-radius:10px;background:var(--card);box-shadow:var(--shadow);transition:transform .45s cubic-bezier(.3,1.3,.5,1)}
.seg button{position:relative;height:38px;border:0;background:none;cursor:pointer;font-weight:500;color:var(--ink2);display:flex;align-items:center;justify-content:center;gap:8px;transition:color .2s}
.seg button.on{color:var(--ink)}
.seg svg{width:18px;height:18px}
.stats{display:flex;flex-wrap:wrap;gap:clamp(18px,4vw,28px);align-items:flex-end;margin:18px 0 18px}
.stat small{display:block;font-size:13.5px;color:var(--ink2)}
.stat b{font-weight:800;font-size:clamp(30px,4.4vw,42px);line-height:1.15;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.bar{flex:1;min-width:160px;height:7px;border-radius:9px;background:color-mix(in srgb,var(--sage) 30%,transparent);overflow:hidden;margin-bottom:8px}
.bar div{height:100%;background:var(--clay);border-radius:9px;transition:width .8s cubic-bezier(.3,1,.4,1)}
.layout{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
@media(min-width:1180px){.layout{grid-template-columns:minmax(0,1fr) 290px}.side{position:sticky;top:16px;align-self:start}}
.zone{padding:clamp(14px,3vw,18px) clamp(14px,3vw,18px) 20px;margin-bottom:16px}
.zhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.zhead h2{margin:0;font-size:clamp(18px,2.2vw,22px);line-height:1.3}
.zhead span{font-size:14px;font-weight:400;color:var(--ink2);margin-left:10px}
.zfree{font-size:14px;color:var(--ink2)}
.zfree b{font-size:24px;color:var(--sage);font-weight:700;margin:0 4px;vertical-align:-2px}
.scroll{overflow-x:auto;padding:2px;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scrollbar-width:thin}
.lot{min-width:600px;background:var(--asphalt);border-radius:14px;padding:12px 14px}
.row{display:grid;gap:8px}
.lane{position:relative;height:64px;margin:8px -14px;overflow:hidden;background:repeating-linear-gradient(90deg,var(--paint) 0 26px,transparent 26px 54px) center/100% 2px no-repeat}
.lanecar{position:absolute;top:calc(50% - 26px);left:100%;animation:cruise 20s linear infinite;will-change:left}
.lanecar svg{display:block;width:27px;height:52px;transform:rotate(-90deg);filter:drop-shadow(0 4px 4px rgba(0,0,0,.4))}
@keyframes cruise{from{left:100%}to{left:-60px}}
.stall{position:relative;border:2px dashed var(--paint);border-radius:9px;background:transparent;cursor:pointer;padding:0;color:var(--onLot);transition:transform .2s,background .2s,opacity .3s}
.stall:hover{transform:translateY(-3px)}
.stall.free{background:color-mix(in srgb,var(--sage) 22%,transparent);border-color:color-mix(in srgb,var(--sage) 70%,var(--onLot))}
.stall.busy{border-style:solid;border-color:color-mix(in srgb,var(--paint) 55%,transparent)}
.stall.fault{border-color:var(--busy);background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--busy) 30%,transparent) 0 6px,transparent 6px 12px)}
.stall.blocked{border-style:dashed;border-color:var(--warn);background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--warn) 26%,transparent) 0 6px,transparent 6px 12px)}
.stall.sel{border:2px solid var(--clay);box-shadow:0 0 0 3px color-mix(in srgb,var(--clay) 45%,transparent);z-index:3}
.sid{position:absolute;left:50%;transform:translateX(-50%);bottom:5px;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;padding:1px 6px;border-radius:6px;z-index:2}
.free .sid,.fault .sid,.blocked .sid{top:50%;bottom:auto;transform:translate(-50%,-50%);font-size:12px}
.blocked .sid{background:color-mix(in srgb,var(--warn) 85%,transparent);color:#2A2622}
.warnmark{position:absolute;top:5px;left:5px;width:16px;height:16px;border-radius:99px;background:var(--warn);color:#2A2622;display:grid;place-items:center;z-index:2;animation:blink 1.6s ease-in-out infinite}
.warnmark svg{width:9px;height:9px}
.blockcar{position:absolute;left:10%;right:10%;height:36%;display:grid;place-items:center;pointer-events:none;z-index:1;opacity:.92}
.blockcar svg{width:100%;height:auto;transform:rotate(90deg);filter:drop-shadow(0 3px 3px rgba(0,0,0,.35))}
.row:first-child .blockcar{bottom:-6%}
.row:last-child .blockcar{top:-6%}
.iso{padding:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,var(--card) 90%,var(--clay)),var(--card))}.isowrap{position:relative}.iso canvas{display:block;width:100%;touch-action:none;cursor:grab}.iso canvas:active{cursor:grabbing}.isohint{margin:0;padding:6px 16px 12px;font-size:12px;color:var(--ink3)}
.isoctl{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px;z-index:5}
.isoctl button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:17px;font-weight:700;cursor:pointer;display:grid;place-items:center;box-shadow:var(--shadow);line-height:1;transition:transform .15s}
.isoctl button:active{transform:scale(.92)}
.isoctl button.rst{font-size:14px}
.vt{display:inline-flex;gap:4px;padding:4px;border-radius:12px;background:color-mix(in srgb,var(--ink) 7%,transparent);margin:0 0 14px}.vt button{border:0;background:none;color:var(--ink2);font:inherit;font-size:13px;font-weight:600;padding:7px 14px;border-radius:9px;cursor:pointer}.vt button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.legend{display:flex;flex-wrap:wrap;gap:14px 20px;font-size:13px;color:var(--ink2);margin:0 0 18px}
.legend span{display:flex;align-items:center;gap:7px}
.legend i{width:10px;height:10px;border-radius:99px;flex:none}
.forecast{padding:clamp(14px,3vw,18px) clamp(14px,3vw,18px) 22px;margin-bottom:16px}
.fhead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.fhead h2{margin:0;font-size:clamp(18px,2.2vw,22px);line-height:1.3}
.fhead h2 span{font-size:14px;font-weight:400;color:var(--ink2);margin-left:10px}
.ftoggle{display:flex;align-items:center;gap:8px}
.fseg{display:flex;gap:4px;background:color-mix(in srgb,var(--ink) 7%,transparent);padding:4px;border-radius:12px}
.fseg button{border:0;background:none;cursor:pointer;padding:7px 12px;border-radius:9px;font-weight:500;font-size:13.5px;color:var(--ink2);transition:background .2s,color .2s}
.fseg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.fnow{height:34px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:13px;color:var(--ink2);transition:transform .15s}
.fnow:active{transform:scale(.95)}
.finsight{margin:2px 0 18px;font-size:14px;color:var(--ink2);line-height:1.65}
.finsight b{color:var(--ink);font-weight:600}
.fchart{display:flex;align-items:flex-end;gap:3px;height:92px;margin:0 0 22px;padding:0 2px}
.fbar{flex:1;min-width:0;height:100%;display:flex;align-items:flex-end;justify-content:center;border:0;background:none;cursor:pointer;padding:0;position:relative}
.fbar::after{content:"";display:block;width:100%;height:var(--h);border-radius:4px 4px 2px 2px;background:color-mix(in srgb,var(--sage) 55%,transparent);transition:height .5s cubic-bezier(.3,1,.4,1),background .2s,outline-color .2s}
.fbar.peak::after{background:color-mix(in srgb,var(--busy) 60%,transparent)}
.fbar.sel::after{outline:2px solid var(--clay);outline-offset:1px}
.fbar em{position:absolute;bottom:-19px;left:50%;transform:translateX(-50%);font-style:normal;font-size:10.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.fzones{display:grid;gap:12px}
.fzone{display:grid;grid-template-columns:1fr auto;column-gap:10px;row-gap:6px;align-items:center;font-size:14px}
.fzone b{font-weight:600}
.fzone .flvl{font-size:12.5px;font-weight:600;padding:2px 8px;border-radius:7px}
.fzone.open .flvl{color:var(--sage);background:color-mix(in srgb,var(--sage) 18%,transparent)}
.fzone.mid .flvl{color:var(--warn);background:color-mix(in srgb,var(--warn) 18%,transparent)}
.fzone.tight .flvl{color:var(--busy);background:color-mix(in srgb,var(--busy) 18%,transparent)}
.ftrack{grid-column:1/-1;height:7px;border-radius:99px;background:color-mix(in srgb,var(--ink) 9%,transparent);overflow:hidden}
.ftrack div{height:100%;border-radius:99px;transition:width .6s cubic-bezier(.3,1,.4,1)}
.fzone.open .ftrack div{background:var(--sage)}
.fzone.mid .ftrack div{background:var(--warn)}
.fzone.tight .ftrack div{background:var(--busy)}
.busy .sid{background:rgba(0,0,0,.5)}
.charging .sid{top:5px;bottom:auto;left:6px;transform:none}
.car{position:absolute;inset:5% 10% 12%;display:grid;place-items:center;pointer-events:none;z-index:1}
.car.in{animation:in 1s cubic-bezier(.16,.9,.3,1) both}
.car.out{animation:out .75s cubic-bezier(.55,0,.8,.4) forwards}
@keyframes in{0%{transform:translateY(var(--from)) scale(.92);opacity:0}30%{opacity:1}100%{transform:none;opacity:1}}
@keyframes out{0%{transform:none;opacity:1}100%{transform:translateY(var(--from)) scale(.94);opacity:0}}
.art{height:100%;width:auto;filter:drop-shadow(0 5px 5px rgba(0,0,0,.4))}
.flip{transform:rotate(180deg)}
.bolt{position:absolute;top:5px;right:5px;width:16px;height:16px;border-radius:99px;background:var(--sage);color:#fff;display:grid;place-items:center;z-index:2}
.bolt svg{width:10px;height:10px}
.ev{position:absolute;top:5px;right:6px;width:11px;height:11px;color:var(--onLot);opacity:.75}
.chargebar{position:absolute;left:6px;right:6px;bottom:5px;height:5px;border-radius:99px;background:rgba(0,0,0,.35);overflow:hidden;z-index:3;box-shadow:0 0 0 1px rgba(255,255,255,.15) inset}
.chargebar div{height:100%;background:var(--sage);border-radius:99px;transition:width .8s cubic-bezier(.3,1,.4,1)}
.chargelabel{position:absolute;left:0;right:0;bottom:11px;text-align:center;font-size:9px;font-weight:700;color:var(--onLot);z-index:3;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.side{padding:18px}
.side h3{margin:0;font-size:18px;display:flex;justify-content:space-between;align-items:baseline}
.side h3 small{font-size:13px;color:var(--ink3);font-weight:400}
.feed{list-style:none;margin:8px 0 0;padding:0;max-height:440px;overflow-y:auto}
.feed li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);animation:slide .5s cubic-bezier(.2,.9,.3,1)}
@keyframes slide{from{opacity:0;transform:translateX(-14px)}}
.thumb{width:44px;height:34px;border-radius:9px;background:var(--bg);display:grid;place-items:center;flex:none}
.thumb svg{height:26px;transform:rotate(90deg)}
.feed b{font-size:14.5px;font-weight:600}
.feed em{font-style:normal;font-size:13px;font-weight:600;margin-left:6px}
.feed p{margin:0;font-size:13px;color:var(--ink3)}
.tip{position:fixed;width:244px;z-index:60;pointer-events:none}
.tip>div{padding:13px 15px;animation:pop .16s ease-out both;box-shadow:0 18px 40px -12px rgba(40,25,10,.5)}
@keyframes pop{from{opacity:0;transform:translateY(5px) scale(.97)}}
.sheet{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:min(400px,calc(100% - 24px));padding:16px 18px;z-index:50;animation:up .35s cubic-bezier(.2,1,.3,1) both;transform:translateX(-50%);box-shadow:0 20px 50px -14px rgba(40,25,10,.45)}
@keyframes up{from{opacity:0;transform:translate(-50%,24px)}}
.sheet .h,.tip .h{display:flex;align-items:center;gap:10px}
.chip{background:var(--clay);color:var(--clayInk);font-weight:600;font-size:13px;padding:2px 9px;border-radius:8px}
.sheet dl,.tip dl{margin:12px 0 0;display:grid;gap:7px}
.sheet dl div,.tip dl div{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.sheet dt,.tip dt{color:var(--ink3)}.sheet dd,.tip dd{margin:0;font-weight:500}
.x{margin-left:auto;border:0;background:var(--bg);width:30px;height:30px;border-radius:99px;cursor:pointer;font-size:16px}
footer{margin-top:8px;font-size:13px;color:var(--ink3)}
@media (prefers-reduced-motion:reduce){.lanecar,.dot.on,.tip>div{animation:none}.car.in,.car.out{animation-duration:.01s}*{transition-duration:.01ms!important}}

.shell{display:flex;align-items:flex-start;max-width:1400px;margin:0 auto}
.shell>.wrap{flex:1;min-width:0;margin:0}
.sidebar{position:sticky;top:0;flex:none;width:190px;height:100vh;padding:16px 10px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line);transition:width .3s cubic-bezier(.3,1,.4,1)}
.sidebar.min{width:60px}
.sbtoggle{align-self:flex-end;width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--card);cursor:pointer;display:grid;place-items:center;margin-bottom:12px}
.sbtoggle svg{width:18px;height:18px;transition:transform .3s}
.min .sbtoggle{align-self:center}.min .sbtoggle svg{transform:rotate(180deg)}
.sbitem{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border:0;border-radius:10px;background:none;cursor:pointer;font-weight:600;font-size:14px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-align:left;transition:background .2s,color .2s}
.sbitem svg{width:19px;height:19px;flex:none}
.sbitem:hover{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.sbitem.on{background:var(--ink);color:var(--card)}
.min .sbitem{justify-content:center;padding:0}.min .sbitem span{display:none}
@media(max-width:760px){.shell{display:block}.sidebar{position:static;width:auto!important;height:auto;flex-direction:row;padding:10px 14px;border-right:0;border-bottom:1px solid var(--line)}.sbtoggle{display:none}.min .sbitem span{display:inline}.sbitem{flex:1;justify-content:center;padding:0 10px;font-size:14px}}
.flsum{display:flex;flex-wrap:wrap;gap:20px clamp(24px,5vw,56px);align-items:flex-end;padding:18px clamp(16px,3vw,24px);margin-bottom:20px}
.flsum small{display:block;font-size:13px;color:var(--ink2)}
.flsum b{font-size:clamp(24px,3vw,28px);font-weight:800;line-height:1.05;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.flsum .mw{flex:1;min-width:200px}.flsum .mw span{font-size:12.5px;color:var(--ink2)}
.flmeter{height:12px;border-radius:99px;background:color-mix(in srgb,var(--sage) 28%,transparent);overflow:hidden;margin-bottom:8px}

.toast .x{position:absolute;right:10px;top:9px}
.sign{background:#050607;color:#fff;border-radius:20px;padding:clamp(16px,4vw,36px);min-height:70vh;display:flex;flex-direction:column;gap:16px}
.signtop{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:clamp(16px,2.4vw,26px);font-weight:600}

.sr.ok{background:#0c3d2c;color:#3dffb0}.sr.low{background:#4a3208;color:#ffc24a}.sr.full{background:#4a1512;color:#ff6b60}

.door span{writing-mode:vertical-rl;font-size:11.5px;font-weight:700;color:var(--onLot);background:rgba(0,0,0,.72);padding:6px 2px;border-radius:5px;letter-spacing:.03em}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;
const pad = n => String(n).padStart(2,"0");
const hash = s => { let h=2166136261; for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);} return h>>>0; };
const rnd = s => (hash(s)%10000)/10000;
const pick = a => a[Math.floor(Math.random()*a.length)];

const FLEETS = {
  car:   { label:"รถยนต์",       per:8, asp:.7,  zones:[{key:"A",name:"ชั้น 1",note:"ประตู A1"},{key:"B",name:"ชั้น 2",note:"ประตู A2"},{key:"D",name:"ชั้น 3",note:"ประตู A3"}] },
  bike:  { label:"มอเตอร์ไซค์", per:9, asp:.8,  zones:[{key:"C",name:"โซน A",note:"ที่จอดมอเตอร์ไซค์"}] },
};
const ZONE_FACTOR = { A:1.03, B:0.96, D:1, C:1 };
const WEEKDAY_CURVE = [8,5,4,4,5,8,15,25,35,40,42,45,48,46,45,48,55,82,90,85,60,40,25,14].map(v=>Math.round(38+v*.35));
const WEEKEND_CURVE = [15,10,8,6,6,8,15,25,40,55,70,85,92,90,85,80,78,75,72,65,55,45,35,22].map(v=>Math.round(38+v*.35));
const clampPct = (v,a,b) => Math.max(a, Math.min(b, v));
const bandsAbove = (curve, th) => {
  const out = []; let s = null;
  curve.forEach((v,h) => { if (v>=th){ if(s===null) s=h; } else if (s!==null){ out.push([s,h-1]); s=null; } });
  if (s!==null) out.push([s,23]);
  return out;
};
const curveAt=(c,t)=>{const i=Math.floor(t)%24;return c[i]+(c[(i+1)%24]-c[i])*(t-Math.floor(t));};
const hrs=ms=>{const d=new Date(ms);return d.getHours()+d.getMinutes()/60+d.getSeconds()/3600;};
const isWk=ms=>[0,6].includes(new Date(ms).getDay());
const curveFor=ms=>isWk(ms)?WEEKEND_CURVE:WEEKDAY_CURVE;
const hhmm=ms=>{const d=new Date(ms);return pad(d.getHours())+":"+pad(d.getMinutes());};
const rr=x=>Math.floor(x+Math.random());
const MEAN_STAY={car:12,bike:9}, DAYS=["อา.","จ.","อ.","พ.","พฤ.","ศ.","ส."];
const TH="กขคจชญดตทนบปพมรลวสหอ";
const genPlate=()=>{const r=n=>Math.floor(Math.random()*n);return (Math.random()<.4?(1+r(9)):"")+TH[r(TH.length)]+TH[r(TH.length)]+" "+(1000+r(9000));};
const fmtRange = ([a,b]) => `${pad(a)}:00–${pad(b+1===24?0:b+1)}:00`;
const bestQuietWindow = curve => {
  let bestStart = 6, bestAvg = Infinity;
  for (let h=6; h<=21; h++){ const avg=(curve[h]+curve[h+1])/2; if (avg<bestAvg){ bestAvg=avg; bestStart=h; } }
  return [bestStart, bestStart+1];
};
const PAINT = [
  {body:"#E7ECF3",trim:"#C3CBD6"},{body:"#AEB8C6",trim:"#8B95A4"},{body:"#2C323C",trim:"#1B1F26"},
  {body:"#D24B45",trim:"#A8332E"},{body:"#3A6FD8",trim:"#2A51A6"},{body:"#2C3E66",trim:"#1D2A47"},
];
const CAR_MODELS = ["Toyota Yaris","Honda Civic","Audi Q7","Isuzu D-Max","Mazda 2","Ford Ranger"];
const EV_MODELS = ["Tesla Model 3","Tesla Model Y","BYD Atto 3","BYD Seal","BYD Dolphin"];
const BIKE_MODELS = ["Honda Wave 110i","Honda PCX 160","Honda Forza 350","Yamaha Aerox 155","Yamaha NMAX","Yamaha Fino 125"];
const modelFor = s => s.fleet==="bike" ? pick(BIKE_MODELS) : pick(s.ev ? EV_MODELS : CAR_MODELS);
const PLATES = ["ABC-123","กข 4471","2กฆ 8810","ญบ 1193","5ขค 7026","ทล 3348","1งจ 9052","พว 6617"];
const dur = m => { m=Math.round(m); return m >= 60 ? `${Math.floor(m/60)} ชม. ${m%60} นาที` : `${m} นาที`; };

function buildSlots(ms=Date.now()){
  const out = {};
  Object.entries(FLEETS).forEach(([fleet,f]) => f.zones.forEach(z => {
    for(let i=1;i<=f.per*2;i++){
      const id = z.key+pad(i), r = rnd(id+fleet), r2 = rnd(id+"x"+fleet), r3 = rnd(id+"blk"+fleet), r4 = rnd(id+"m"+fleet), occ = id!=="B11" && r < clampPct(curveAt(curveFor(ms),hrs(ms))*ZONE_FACTOR[z.key],0,100)/100;
      const blocked = !occ && r3 > .965 && id!=="B11", ev = fleet==="car" && i>=5 && i<=8, pool = fleet==="bike" ? BIKE_MODELS : (ev ? EV_MODELS : CAR_MODELS);
      out[id] = { id, fleet, zone:z.key, row:i<=f.per?0:1, occupied:occ, leaving:false, gen:0,
        ev, charging: fleet==="car" && i>=5 && i<=8 && occ && r2>.5, faulty: id==="B11", off: id==="B11"||rnd(id+"off")>.965, offAt: ms-(720+Math.floor(rnd(id+"a")*10000))*1000, blocked,
        paint: PAINT[Math.floor(r2*PAINT.length)], model: pool[Math.floor(r4*pool.length)],
        plate: PLATES[Math.floor(r2*PLATES.length)], minutes: occ ? (rnd(id+"lg")<.04 ? 300+Math.floor(rnd(id+"mm")*200) : 2+Math.min(90,Math.floor(-Math.log(1-rnd(id+"mm")*.999)*MEAN_STAY[fleet]))) : 0,
        blockedMin: blocked ? 2+Math.floor(rnd(id+"bm")*20) : 0, charge: 40+Math.floor(r4*59) };
    }
  }));
  // มีรถจอดขวางโผล่มาตั้งแต่เปิดหน้า อย่างน้อย 3 ช่องต่อประเภทรถ
  Object.keys(FLEETS).forEach(fleet => {
    const L = Object.values(out).filter(s => s.fleet===fleet);
    let n = L.filter(s => s.blocked).length;
    const cand = L.filter(s => !s.occupied && !s.blocked && !s.faulty).sort((x,y) => rnd(x.id+"pop"+fleet) - rnd(y.id+"pop"+fleet));
    while (n < 3 && cand.length) { const s = cand.shift(); s.blocked = true; s.blockedMin = 2+Math.floor(rnd(s.id+"pm")*14); n++; }
  });
  return out;
}

const CarTop = ({paint,className}) => (
  <svg viewBox="0 0 48 92" className={className} aria-hidden="true">
    <rect x="6.5" y="3" width="35" height="86" rx="13" fill={paint.body}/>
    <rect x="9" y="6" width="12" height="80" rx="6" fill="#fff" opacity=".14"/>
    <path d="M13 27h22l-2.3-9.4a4 4 0 0 0-3.9-3h-9.6a4 4 0 0 0-3.9 3L13 27Z" fill="#0B1220" opacity=".62"/>
    <path d="M13 58h22l-2.1 8.6a4 4 0 0 1-3.9 3h-10a4 4 0 0 1-3.9-3L13 58Z" fill="#0B1220" opacity=".5"/>
    <rect x="3.2" y="30" width="4.6" height="8" rx="2.3" fill={paint.trim}/><rect x="40.2" y="30" width="4.6" height="8" rx="2.3" fill={paint.trim}/>
    <rect x="13" y="4.5" width="8" height="3.2" rx="1.6" fill="#FFF6D6"/><rect x="27" y="4.5" width="8" height="3.2" rx="1.6" fill="#FFF6D6"/>
    <rect x="13" y="84.5" width="8" height="3.2" rx="1.6" fill="#FF7B72"/><rect x="27" y="84.5" width="8" height="3.2" rx="1.6" fill="#FF7B72"/>
  </svg>
);
const BikeTop = ({paint,className}) => (
  <svg viewBox="0 0 48 92" className={className} aria-hidden="true">
    <rect x="21" y="8" width="6" height="76" rx="3" fill={paint.trim}/>
    <rect x="17" y="30" width="14" height="30" rx="6" fill={paint.body}/>
    <rect x="12" y="26" width="24" height="4.5" rx="2.2" fill={paint.trim}/>
    <circle cx="24" cy="22" r="5" fill="#0B1220" opacity=".5"/>
    <rect x="19.5" y="60" width="9" height="16" rx="4" fill={paint.body} opacity=".85"/>
  </svg>
);
const ART = { car:CarTop, bike:BikeTop };
const Bolt = () => <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M9 1.5 3.6 9h3.6l-.6 5.5L12.4 7H8.7l.3-5.5Z"/></svg>;
const Warn = () => <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 1.5 1 14h14L8 1.5Z" opacity=".18"/><rect x="7.2" y="5.5" width="1.6" height="4.4" rx=".8"/><circle cx="8" cy="11.6" r="1"/></svg>;
const TabIcon = ({k}) => k==="bike" ? (
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"><circle cx="5" cy="16.5" r="3.3"/><circle cx="19" cy="16.5" r="3.3"/><path d="M8.2 16.5h3.1l3-6.2h3.2M12 10.3 9.4 7.2H7.1"/></svg>
) : (
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"><path d="M2.8 16.5v-4.2l2-5.1a2 2 0 0 1 1.9-1.2h10.6a2 2 0 0 1 1.9 1.2l2 5.1v4.2H2.8ZM3.5 16.5v2.2h3v-2.2M17.5 16.5v2.2h3v-2.2M4.8 12.3h14.4"/></svg>
);

function Stall({ s, sel, dim, onSelect, onHover, delay }){
  const Art = ART[s.fleet], top = s.row === 0;
  const st = s.faulty ? "fault" : s.occupied ? "busy" : s.blocked ? "blocked" : "free";
  const label = st==="free" ? "ว่าง" : st==="fault" ? "เซนเซอร์ขัดข้อง" : st==="blocked" ? "ว่าง แต่มีรถจอดขวางทางเข้า" : "มีรถจอด";
  return (
    <button type="button" onClick={() => onSelect(s.id)} aria-pressed={sel}
      onMouseEnter={e => onHover(s.id, e.currentTarget.getBoundingClientRect())} onMouseLeave={() => onHover(null)}
      onFocus={e => onHover(s.id, e.currentTarget.getBoundingClientRect())} onBlur={() => onHover(null)}
      aria-label={`ช่อง ${s.id} ${label}`}
      className={`stall ${st}${s.charging&&s.occupied?" charging":""}${sel?" sel":""}`} style={{ aspectRatio:FLEETS[s.fleet].asp, opacity:dim?.2:1 }}>
      <span className="sid">{s.id}</span>
      {s.occupied && (
        <span key={s.gen} className={"car "+(s.leaving?"out":"in")}
          style={{ "--from": top?"120%":"-120%", animationDelay: s.gen===0&&!s.leaving ? delay+"ms" : "0ms" }}>
          <Art paint={s.paint} className={"art"+(top?"":" flip")} />
        </span>
      )}
      {s.blocked && (
        <>
          <span className="warnmark" title="มีรถจอดขวางทางเข้า"><Warn/></span>
          <span className="blockcar"><Art paint={s.paint} className="art" /></span>
        </>
      )}
      {s.ev && <span className={s.charging?"bolt":"ev"}><Bolt/></span>}
      {s.charging && <>
        <span className="chargelabel">{Math.round(s.charge)}%</span>
        <span className="chargebar"><div style={{ width:Math.round(s.charge)+"%" }} /></span>
      </>}
    </button>
  );
}

function Zone({ z, f, fleet, slots, sel, q, tf, onSelect, onHover, idx }){
  const Art = ART[fleet];
  const rows = [0,1].map(r => Array.from({length:f.per},(_,c) => slots[z.key+pad(r*f.per+c+1)]));
  const all = rows.flat(), free = all.filter(s => !s.occupied).length, blocked = all.filter(s => s.blocked).length;
  const match = s => !q || `${s.id} ${s.occupied?s.plate:""} zone ${s.zone} โซน ${s.zone}`.toLowerCase().includes(q);
  const renderRow = r => (
    <div className="row" style={{ gridTemplateColumns:`repeat(${f.per},minmax(0,1fr))` }}>
      {rows[r].map((s,c) => <Stall key={s.id} s={s} sel={sel===s.id} dim={!match(s)||!typeOk(s,tf)} onSelect={onSelect} onHover={onHover} delay={(c+r*3+idx*4)*55} />)}
    </div>
  );
  return (
    <section className="card zone">
      <div className="zhead">
        <h2 className="serif">{z.name}<span>{z.note}</span></h2>
        <p className="zfree" style={{margin:0}}>ว่าง<b>{free}</b>จาก {all.length} ช่อง{blocked>0 && <span style={{color:"var(--warn)",fontWeight:600}}> · จอดขวาง {blocked}</span>}</p>
      </div>
      <div className="scroll"><div className="lot hasdoor"><div className="door" aria-label={"ประตูห้าง "+z.name}><span>ประตูห้าง</span></div>
        {renderRow(0)}
        <div className="lane"><div className="lanecar" style={{ animationDelay:`${-idx*9}s` }}><Art paint={PAINT[(idx*2+3)%6]} /></div></div>
        {renderRow(1)}
      </div></div>
    </section>
  );
}

function Detail({ s, onClose }){
  const sensor = s.faulty ? "แจ้งเตือนขัดข้อง" : "ปกติ";
  const rows = s.occupied ? [["รถ",s.model],["ทะเบียน",s.plate],["จอดมาแล้ว",dur(s.minutes)],["เซนเซอร์",sensor],
    ...(s.ev?[["การชาร์จ",s.charging?`${Math.round(s.charge)}% กำลังชาร์จ`:"ไม่ได้เสียบสายชาร์จ"]]:[])]
    : s.blocked ? [["สถานะช่อง","ว่าง (เซนเซอร์ไม่พบรถในช่อง)"],["รถที่จอดขวาง",s.model],["ทะเบียนรถที่ขวาง",s.plate],["ขวางทางเข้ามาแล้ว",dur(s.blockedMin)],["เซนเซอร์",sensor],["โซน",s.zone]]
    : [["เซนเซอร์",sensor],["ที่ชาร์จ",s.ev?"มีที่ชาร์จที่ช่องนี้":"ไม่มี"],["โซน",s.zone]];
  const label = s.faulty?"เซนเซอร์ขัดข้อง":s.occupied?"มีรถจอด":s.blocked?"ว่าง แต่มีรถจอดขวาง":"ว่าง";
  const color = s.faulty?"var(--busy)":s.occupied?"var(--ink2)":s.blocked?"var(--warn)":"var(--sage)";
  return (
    <>
      <div className="h">
        <span className="chip">{s.id}</span>
        <b style={{color}}>{label}</b>
        {s.occupied && !onClose && <span style={{marginLeft:"auto",width:14,height:14,borderRadius:99,background:s.paint.body,boxShadow:"0 0 0 1px var(--line)"}} />}
        {onClose && <button className="x" onClick={onClose} aria-label="ปิด">×</button>}
      </div>
      <dl>{rows.map(([k,v]) => <div key={k}><dt>{k}</dt><dd>{v}</dd></div>)}</dl>
    </>
  );
}

function Tip({ s, rect }){

const FEE=20, fee=m=>Math.max(FEE,Math.ceil(m/60)*FEE);
const zinfo=s=>FLEETS[s.fleet].zones.find(z=>z.key===s.zone);
const zidx=s=>FLEETS[s.fleet].zones.findIndex(z=>z.key===s.zone);
const colOf=s=>(parseInt(s.id.slice(1))-1)%FLEETS[s.fleet].per;
const typeOk=(s,t)=>t==="all"||(t==="ev"&&s.ev);
const TYPES=[["all","ทุกประเภท"],["ev","⚡ ชาร์จ EV"]];
const norm=x=>x.toLowerCase().replace(/[\s-]/g,"");
const sensor=(s,t)=>{const off=s.faulty||s.off,n=t||Date.now();return {off,ago:off?Math.max(60,Math.floor((n-(s.offAt||0))/1000)):Math.floor((n/1000+rnd(s.id+"s")*60)%60)+1};};
const agoTxt=a=>a<60?`${a} วินาทีที่แล้ว`:a<3600?`${Math.floor(a/60)} นาทีที่แล้ว`:`${dur(Math.floor(a/60))}ที่แล้ว`;
const nearest=l=>[...l].sort((a,b)=>(colOf(a)-colOf(b))||(zidx(a)-zidx(b))||a.id.localeCompare(b.id));
function TypeChips({tf,setTf}){return <div className="fseg" role="group" aria-label="ประเภทช่อง" style={{display:"inline-flex",flexWrap:"wrap"}}>{TYPES.map(([k,l])=><button key={k} type="button" className={tf===k?"on":""} onClick={()=>setTf(k)}>{l}</button>)}</div>;}

const CX=t=>30+t*(550/24), CY=v=>180-v*1.6;
function LiveTip({last,target,getT}){
  const v=useRef(target),[p,setP]=useState(()=>({x:CX(hrs(getT())),y:target}));
  useEffect(()=>{let id;const loop=()=>{v.current+=(target-v.current)*.12;setP({x:CX(hrs(getT())),y:v.current});id=requestAnimationFrame(loop);};id=requestAnimationFrame(loop);return()=>cancelAnimationFrame(id);},[target]);
  const x=p.x,y=CY(p.y);
  return <g>
    <line x1={x} x2={x} y1={CY(100)} y2={CY(0)} stroke="var(--clay)" strokeOpacity=".25" strokeDasharray="3 3"/>
    {last&&<line x1={CX(last[0])} y1={CY(last[1])} x2={x} y2={y} stroke="var(--clay)" strokeWidth="3" strokeLinecap="round"/>}
    <circle className="pulse" cx={x} cy={y} r="9" fill="var(--clay)" opacity=".22"/><circle cx={x} cy={y} r="5" fill="var(--clay)"/>
    <text x={Math.min(x,556)} y={y-12} fontSize="11" fontWeight="700" textAnchor="middle" fill="var(--clay)">{Math.round(p.y)}%</text>
  </g>;
}
function Stats({slots,fleet,live,simT,trail,getT}){
  const wk=isWk(simT), curve=wk?WEEKEND_CURVE:WEEKDAY_CURVE, t=hrs(simT);
  const all=Object.values(slots).filter(s=>s.fleet===fleet), occ=all.filter(s=>s.occupied), nowPct=Math.round(occ.length/all.length*100);
  const tr=trail[fleet]||[], last=tr[tr.length-1];
  const avgStay=occ.length?Math.round(occ.reduce((a,s)=>a+s.minutes,0)/occ.length):0;
  const peakAvg=curve.indexOf(Math.max(...curve)), mx=[...tr,[t,nowPct]].reduce((a,b)=>b[1]>a[1]?b:a), peakToday=Math.floor(mx[0]);
  const diff=nowPct-Math.round(curveAt(curve,t));
  const line=a=>a.map((p,i)=>`${i?"L":"M"}${CX(p[0])} ${CY(p[1])}`).join("");
  const zrows=FLEETS[fleet].zones.map(z=>{const l=all.filter(s=>s.zone===z.key),o=l.filter(s=>s.occupied);return {z,pct:Math.round(o.length/l.length*100),st:o.length?Math.round(o.reduce((a,s)=>a+s.minutes,0)/o.length):0};});
  return <div>
    <section className="card flsum"><div><small>ใช้งานตอนนี้</small><b>{nowPct}%</b></div>
      <div><small>เทียบค่าเฉลี่ยชั่วโมงนี้</small><b style={{color:diff>0?"var(--busy)":"var(--sage)"}}>{diff>0?"+":""}{diff}%</b></div>
      <div><small>เวลาจอดเฉลี่ย</small><b>{dur(avgStay)}</b></div>
      <div><small>ชั่วโมงที่แน่นที่สุด (วันนี้ / ค่าเฉลี่ย)</small><b>{pad(peakToday)}:00 / {pad(peakAvg)}:00</b></div></section>
    <section className="card fldetail">
      <h2 className="serif flt">การใช้งาน{FLEETS[fleet].label}วันนี้เทียบกับค่าเฉลี่ย ({wk?"เสาร์-อาทิตย์":"วันธรรมดา"})</h2>
      <div className="scroll"><svg viewBox="0 0 600 210" style={{width:"100%",minWidth:480}} role="img" aria-label="กราฟการใช้งานรายชั่วโมง">
        {[0,25,50,75,100].map(v=><g key={v}><line x1="30" x2="585" y1={CY(v)} y2={CY(v)} stroke="var(--line)"/><text x="4" y={CY(v)+4} fontSize="10" fill="var(--ink3)">{v}%</text></g>)}
        {curve.map((_,i)=>i%3===0&&<text key={i} x={CX(i)} y="200" fontSize="10" textAnchor="middle" fill="var(--ink3)">{pad(i)}</text>)}
        <path d={line([...curve,curve[0]].map((v,i)=>[i,v]))} fill="none" stroke="var(--ink3)" strokeWidth="2" strokeDasharray="5 4"/>
        <path d={line(tr)} fill="none" stroke="var(--clay)" strokeWidth="3" strokeLinejoin="round" strokeLinecap="round"/>
        <LiveTip last={last} target={nowPct} getT={getT}/></svg></div>
      <div className="legend" style={{margin:"8px 0 0"}}><span><i style={{background:"var(--clay)"}}/>วันนี้{live&&<span className="dot on" style={{marginLeft:6}}/>}</span><span><i style={{background:"var(--ink3)"}}/>ค่าเฉลี่ย</span></div>
    </section>
    <section className="card fldetail"><h2 className="serif flt">แยกตามชั้น</h2>
      <table className="tbl"><thead><tr><th>ชั้น/โซน</th><th>ใช้งาน</th><th>เวลาจอดเฉลี่ย</th></tr></thead>
      <tbody>{zrows.map(r=><tr key={r.z.key}><td>{r.z.name} · {r.z.note}</td><td>{r.pct}%</td><td>{dur(r.st)}</td></tr>)}</tbody></table></section>
  </div>;
}

function Alerts({slots,fleet,done,setDone,tm}){
  const L=[];
  Object.values(slots).filter(s=>s.fleet===fleet).forEach(s=>{const z=zinfo(s).name;
    if(s.faulty)L.push({k:"f"+s.id,sev:3,t:"เซนเซอร์ขัดข้อง",s,z,d:"ไม่มีสัญญาณ ตรวจสายและไฟเลี้ยง"});
    else if(s.off)L.push({k:"n"+s.id,sev:2,t:"เซนเซอร์ออฟไลน์",s,z,d:"ส่งสัญญาณล่าสุด "+agoTxt(sensor(s,tm).ago)});
    if(s.occupied&&s.minutes>=360)L.push({k:"o"+s.id+s.plate,sev:1,t:"จอดเกินเวลา",s,z,d:`${s.plate} จอดมา ${dur(s.minutes)} (เกิน 6 ชม.)`});
    if(s.blocked&&s.blockedMin>=15)L.push({k:"b"+s.id+s.plate,sev:2,t:"จอดขวางนานเกินกำหนด",s,z,d:`${s.plate} ขวางมา ${dur(s.blockedMin)} (เกิน 15 นาที)`});
  });
  L.sort((a,b)=>(!!done[a.k])-(!!done[b.k])||b.sev-a.sev);
  const open=L.filter(x=>!done[x.k]).length;

function App(){
  const [slots, setSlots] = useState(buildSlots);
  const [fleet, setFleet] = useState("car");
  const [sel, setSel] = useState(null);
  const [q, setQ] = useState("");
  const [live, setLive] = useState(() => !(matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches));
  const [feedAll, setFeedAll] = useState({
    car:[
      {id:1,kind:"in",slot:"B12",paint:PAINT[0],meta:"ABC-123 · 45 นาทีที่แล้ว"},
      {id:2,kind:"out",slot:"A07",paint:PAINT[3],meta:"จอดมา 1 ชม. 2 นาที"},
      {id:3,kind:"in",slot:"A05",paint:PAINT[4],meta:"5ขค 7026 · 1 ชม. 30 นาทีที่แล้ว"},
      {id:4,kind:"block",slot:"A03",paint:PAINT[2],meta:"ทล 3348 จอดขวางทางเข้า"},
    ],
    bike:[
      {id:5,kind:"in",slot:"C05",paint:PAINT[1],meta:"กข 4471 · 4 นาทีที่แล้ว"},
      {id:6,kind:"out",slot:"C11",paint:PAINT[3],meta:"จอดมา 47 นาที"},
      {id:7,kind:"in",slot:"C14",paint:PAINT[2],meta:"ญบ 1193 · 18 นาทีที่แล้ว"},
    ],
  });
  const clk = useRef({ t: Date.now(), at: performance.now(), speed: 1, live });
  const [simT, setSimT] = useState(() => clk.current.t);
  clk.current.live = live;
  const getT = useRef(() => { const c = clk.current; return c.live ? c.t + (performance.now() - c.at) * c.speed : c.t; }).current;
  const rebase = () => { const t = getT(); clk.current = { ...clk.current, t, at: performance.now() }; };
  const toggleLive = () => { rebase(); clk.current.live = !live; setLive(!live); };
  const [trail, setTrail] = useState(() => { const t = clk.current.t, c = curveFor(t), h = Math.floor(hrs(t)), o = {}; Object.keys(FLEETS).forEach(k => { o[k] = Array.from({ length:h }, (_, i) => [i, clampPct(Math.round(c[i]*(.88+rnd("d"+i+k)*.3)),2,98)]); }); return o; });
  const [tip, setTip] = useState(null);
  const canHover = useRef(matchMedia("(hover: hover)").matches).current;
  const onHover = (id, rect) => setTip(id ? { id, rect } : null);
  const ref = useRef(slots), nid = useRef(10);
  const feed = feedAll[fleet];
  const setFeed = fn => setFeedAll(a => ({ ...a, [fleet]: fn(a[fleet]) }));
  const [page, setPage] = useState("map"), [collapsed, setCollapsed] = useState(false);
  const [isAdmin,setIsAdmin]=useState(false),[tf,setTf]=useState("all"),[watch,setWatch0]=useState({on:false,zone:"A",n:5}),[toast,setToast]=useState(null),[done,setDone]=useState({});const fired=useRef(false);
  const [view,setView]=useState("2d"),[target,setTarget]=useState(null),[fl,setFl]=useState("all");
  const setWatch=v=>{fired.current=false;setWatch0(v);};
  const [fsel, setFsel] = useState({ car:"A", bike:"C" }), [ffilter, setFfilter] = useState("free");
  const f = FLEETS[fleet];
  const noun = fleet==="bike" ? "มอเตอร์ไซค์" : "รถ";
  const mine = Object.values(slots).filter(s => s.fleet === fleet);
  const occ = mine.filter(s => s.occupied).length, faults = mine.filter(s => s.faulty).length, blocks = mine.filter(s => s.blocked).length;

  useEffect(() => { setSel(null); setQ(""); setFl("all"); }, [fleet]);
  useEffect(() => { if(!watch.on) return; const n=Object.values(slots).filter(s=>s.zone===watch.zone&&!s.occupied).length;
    if(n>watch.n){ if(!fired.current){ fired.current=true; setToast(`🔔 ${FLEETS.car.zones.find(z=>z.key===watch.zone).name}มีช่องว่าง ${n} ช่อง (เกิน ${watch.n})`); } } else fired.current=false; }, [slots,watch]);
  useEffect(() => { if(!target) return; const t=slots[target]; if(t&&!t.occupied&&!t.blocked&&!t.faulty) return;
    const nb=nearest(Object.values(slots).filter(x=>x.fleet===t.fleet&&x.id!==target&&(fl==="all"||x.zone===fl)&&!x.occupied&&!x.faulty&&!x.blocked&&typeOk(x,tf)))[0];
    if(nb){ setTarget(nb.id); setSel(nb.id); setToast(`มีคนจอดช่อง ${target} แล้ว แนะนำช่อง ${nb.id} (${zinfo(nb).name}) ซึ่งใกล้ประตูที่สุด`); }
    else { setTarget(null); setToast(`มีคนจอดช่อง ${target} แล้ว และตอนนี้ไม่มีช่องว่างตามเงื่อนไข`); } }, [slots]);

  useEffect(() => {
    if (!live) return;
    const tm = setInterval(() => {
      const c0 = clk.current, pn = performance.now(), now = c0.t + (pn - c0.at) * c0.speed;
      const dtMin = Math.min(240, (now - c0.t) / 60000), rolled = new Date(c0.t).getDate() !== new Date(now).getDate();
      clk.current = { ...c0, t: now, at: pn };
      const S = { ...ref.current }, out = [], at = hhmm(now), th = hrs(now), cv = curveFor(now);
      const set = (id, p) => { S[id] = { ...S[id], ...p }; };
      const add = (fl, kind, id, paint, meta) => out.push([fl, { id: nid.current++, kind, slot: id, paint, meta, at }]);
      const of = fl => Object.values(S).filter(s => s.fleet === fl);
      Object.keys(FLEETS).forEach(fl => {
        const pl = dtMin / MEAN_STAY[fl];
        of(fl).forEach(s => {
          const p = {};
          if (s.occupied) { p.minutes = s.minutes + dtMin; if (s.charging) { p.charge = Math.min(100, s.charge + dtMin*.5); p.charging = p.charge < 100; } }
          if (s.blocked) { p.blockedMin = s.blockedMin + dtMin; if (s.blockFor!==undefined ? p.blockedMin >= s.blockFor : Math.random() < 1 - Math.exp(-dtMin/20)) { p.blocked = false; p.blockFor = undefined; p.blockedMin = 0; add(fl, "unblock", s.id, s.paint, `รถที่จอดขวาง ${s.plate} ออกแล้ว`); } }
          if (s.occupied && s.stay === undefined) p.stay = s.minutes >= 300 ? s.minutes + 60 + Math.random()*120 : s.minutes + 1 + -Math.log(1-Math.random()*.999)*MEAN_STAY[fl];
          if (s.occupied && !s.leaving && !s.faulty && (p.minutes ?? s.minutes) >= (p.stay ?? s.stay ?? 1e9)) {
            p.leaving = true; add(fl, "out", s.id, s.paint, `จอดมา ${dur(s.minutes)}`); const id = s.id;
            setTimeout(() => { ref.current = { ...ref.current, [id]:{ ...ref.current[id], occupied:false, leaving:false, charging:false, minutes:0 } }; setSlots(ref.current); }, 760);
          }
          set(s.id, p);
        });
        const L = of(fl), eff = L.filter(s => s.occupied && !s.leaving).length, tgt = curveAt(cv, th) / 100 * L.length;
        const pool = L.filter(s => !s.occupied && !s.blocked && !s.faulty && !s.leaving);
        let A = Math.min(pool.length, 12, rr(Math.max(0, tgt*pl + (tgt - eff) * Math.min(1, dtMin/10))));
        while (A-- > 0 && pool.length) {
          const w = pool.map(s => ZONE_FACTOR[s.zone] / (1 + colOf(s)*.25));
          let x = Math.random() * w.reduce((a, b) => a + b, 0), i = 0; while (i < w.length - 1 && (x -= w[i]) > 0) i++;
          const s = pool.splice(i, 1)[0], paint = pick(PAINT), plate = Math.random() < .7 ? genPlate() : pick(PLATES);
          set(s.id, { occupied:true, paint, plate, model:modelFor(s), minutes:0, stay:Math.random()<.04 ? 300+Math.random()*240 : 3+-Math.log(1-Math.random()*.999)*MEAN_STAY[fl], gen:s.gen+1, charging:s.ev && Math.random() > .5, charge:15+Math.floor(Math.random()*60) });
          add(fl, "in", s.id, paint, `${plate} · เมื่อสักครู่`);
        }
        if (Math.random() < dtMin/4 && of(fl).filter(s => s.blocked).length < 4) {
          const op = of(fl).filter(s => !s.occupied && !s.blocked && !s.faulty && !s.leaving);
          if (op.length) { const s = pick(op), paint = pick(PAINT), plate = genPlate(), blockFor = Math.random()<.2 ? 16+Math.random()*14 : 2+-Math.log(1-Math.random()*.999)*5; set(s.id, { blocked:true, blockedMin:1, blockFor, paint, plate, model:modelFor(s) }); add(fl, "block", s.id, paint, `${plate} จอดขวางทางเข้า`); }
        }
      });
      if (Math.random() < dtMin/90) { const on = Object.values(S).filter(s => !s.off); if (on.length) set(pick(on).id, { off:true, offAt:now }); }
      if (Math.random() < dtMin/45) { const offl = Object.values(S).filter(s => s.off && !s.faulty); if (offl.length) set(pick(offl).id, { off:false }); }
      ref.current = S; setSlots(S); setSimT(now);
      if (out.length) setFeedAll(a => { const b = { ...a }; out.forEach(([fl, it]) => { b[fl] = [it, ...b[fl]]; }); Object.keys(b).forEach(k => { b[k] = b[k].slice(0, 14); }); return b; });
      setTrail(tr => { const o = {}; Object.keys(FLEETS).forEach(fl => { const L = Object.values(S).filter(s => s.fleet === fl), v = Math.round(L.filter(s => s.occupied).length / L.length * 100), a = rolled ? [] : (tr[fl] || []), l = a[a.length-1]; o[fl] = !l || th - l[0] >= .05 ? [...a, [th, v]] : a; }); return o; });
    }, 1000);
    return () => clearInterval(tm);
  }, [live]);

  const keys = Object.keys(FLEETS);
  const NAV = [
    ["map","ผังลานจอด",<svg key="a" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.6"/></svg>],
    ["floors","สถานะรายชั้น",<svg key="b" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="m12 3.5 8.5 4.5-8.5 4.5L3.5 8 12 3.5Z"/><path d="m3.5 12.2 8.5 4.5 8.5-4.5M3.5 16.4 12 20.9l8.5-4.5"/></svg>],
  ];
  const I=d=><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d={d}/></svg>;
  const EXTRA=[["tools","ผู้ขับขี่",I("M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11ZM12 10h.01")],
    ...(isAdmin?[["sign","ป้ายทางเข้า",I("M3 5h18v11H3zM8 20h8")],["stats","สถิติ",I("M4 20V10M10 20V4M16 20v-8M22 20H2")],["alerts","แจ้งเตือน",I("M12 3 2 20h20L12 3ZM12 10v4M12 17h.01")],["sensors","เซนเซอร์",I("M5 12a10 10 0 0 1 14 0M8 15a6 6 0 0 1 8 0M12 19h.01")]]:[["admin","ผู้ดูแล",I("M6 11V8a6 6 0 0 1 12 0v3M5 11h14v10H5z")]])];
  const goto=(id,track)=>{setPage("map");setSel(id);if(track)setTarget(id);};
  const gate=c=>isAdmin?c:<Login onOk={()=>{setIsAdmin(true);setPage("stats");}}/>;
  const PAGES={
    tools:()=><Tools slots={slots} fleet={fleet} tf={tf} setTf={setTf} goto={goto} watch={watch} setWatch={setWatch} target={target} setTarget={setTarget} fl={fl} setFl={setFl}/>,
    admin:()=><Login onOk={()=>{setIsAdmin(true);setPage("stats");}}/>,
    sign:()=>gate(<Sign slots={slots} fleet={fleet} simT={simT}/>),stats:()=>gate(<Stats slots={slots} fleet={fleet} live={live} simT={simT} trail={trail} getT={getT}/>),
    alerts:()=>gate(<Alerts slots={slots} fleet={fleet} done={done} setDone={setDone} tm={simT}/>),sensors:()=>gate(<Sensors slots={slots} fleet={fleet} tm={simT}/>)};
  return (
    <div className="shell">
      {toast && <div className="card toast" role="status">{toast}<button type="button" className="x" onClick={()=>setToast(null)} aria-label="ปิด">×</button></div>}
      <nav className={"sidebar"+(collapsed?" min":"")} aria-label="เมนูหลัก">
        <button type="button" className="sbtoggle" onClick={() => setCollapsed(c => !c)} aria-label={collapsed?"ขยายเมนู":"ย่อเมนู"}>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m15 6-6 6 6 6"/></svg>
        </button>
        {[...NAV,...EXTRA].map(([k,label,ic]) => <button key={k} type="button" className={"sbitem"+(page===k?" on":"")} title={label} aria-current={page===k?"page":undefined} onClick={() => setPage(k)}>{ic}<span>{label}</span></button>)}
      </nav>
    <div className="wrap">
      <header className="top">
        <div className="brand">
          <div className="mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <rect x="6.5" y="5.5" width="8.5" height="13" rx="2.4" stroke="currentColor" strokeWidth="1.8"/>
              <path d="M9.2 8.3h3.2a2 2 0 0 1 0 4H9.2z" stroke="currentColor" strokeWidth="1.8" strokeLinejoin="round"/>
              <path d="M9.2 12.3v3.4" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/>
            </svg>
          </div>
          <div className="brandtext"><h1 className="serif">Smart Parking</h1><p>ตรวจจับรถและจำนวนช่องว่าง</p></div>
        </div>
        {page==="map" && <label className="field">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round"><circle cx="7" cy="7" r="4.6"/><path d="m10.6 10.6 3 3"/></svg>
          <input value={q} onChange={e => setQ(e.target.value.trim().toLowerCase())} placeholder="ค้นหาช่องจอด ทะเบียน หรือโซน" />
        </label>}
        <button type="button" className="btn" onClick={toggleLive}><span className={"dot"+(live?" on":"")}/>{live?"สด":"หยุดชั่วคราว"}</button>
        <span className="btn" style={{cursor:"default",fontVariantNumeric:"tabular-nums"}} title="เวลาปัจจุบัน">🕒 {DAYS[new Date(simT).getDay()]} {hhmm(simT)}:{pad(new Date(simT).getSeconds())}</span>
        {isAdmin && <button type="button" className="btn" onClick={() => { setIsAdmin(false); setPage("map"); }}>ออกจากระบบ</button>}
      </header>
      <div className="hazard" aria-hidden="true"/>

      <div className="seg" role="tablist">
        <i style={{ transform:`translateX(${keys.indexOf(fleet)*100}%)` }} />
        {keys.map(k => (
          <button key={k} type="button" role="tab" aria-selected={k===fleet} className={k===fleet?"on":""} onClick={() => setFleet(k)}>
            <TabIcon k={k}/>{FLEETS[k].label}
          </button>
        ))}
      </div>

      {PAGES[page] ? PAGES[page]() : page==="floors" ? <FloorsPage fleet={fleet} f={f} slots={slots} feed={feed} live={live} noun={noun} sel={fsel[fleet]} setSel={k => setFsel(s => ({ ...s, [fleet]:k }))} filter={ffilter} setFilter={setFfilter} /> : <>
      <div className="stats">
        <div className="stat"><small>ว่าง</small><b style={{color:"var(--sage)"}}>{mine.length-occ}</b></div>
        <div className="stat"><small>มีรถจอด</small><b style={{color:"var(--clay)"}}>{occ}</b></div>
        {blocks>0 && <div className="stat"><small>ว่าง แต่ถูกจอดขวาง</small><b style={{color:"var(--warn)"}}>{blocks}</b></div>}
        <div className="stat"><small>ช่องจอดทั้งหมด</small><b>{mine.length}</b></div>
        <div className="bar" role="img" aria-label="อัตราการใช้งานช่องจอด"><div style={{ width:(occ/mine.length*100)+"%" }} /></div>
      </div>
      {fleet==="car" && <div style={{marginBottom:14}}><TypeChips tf={tf} setTf={setTf}/></div>}
      <div className="legend">
        <span><i style={{background:"var(--sage)"}}/>ว่าง</span>
        <span><i style={{background:"var(--ink2)"}}/>มีรถจอด</span>
        <span><i style={{background:"var(--warn)"}}/>ว่าง แต่มีรถจอดขวางทางเข้า</span>
        <span><i style={{background:"var(--busy)"}}/>เซนเซอร์ขัดข้อง</span>
      </div>

      <div className="vt" role="tablist" aria-label="มุมมอง"><button type="button" className={view==="2d"?"on":""} onClick={()=>setView("2d")}>ผัง 2 มิติ</button><button type="button" className={view==="3d"?"on":""} onClick={()=>setView("3d")}>3 มิติ มุมสูง</button></div>
      <div className="layout">
        <main>
          {view==="3d" ? <Iso3D key={fleet} fleet={fleet} f={f} slots={slots} sel={sel} live={live} dimFn={s=>(q&&!`${s.id} ${s.occupied?s.plate:""} zone ${s.zone}`.toLowerCase().includes(q))||!typeOk(s,tf)} onHover={onHover} onSelect={id=>setSel(s=>s===id?null:id)} /> : f.zones.map((z,i) => <Zone key={fleet+z.key} z={z} f={f} fleet={fleet} idx={i} slots={slots} sel={sel} q={q} tf={tf} onHover={onHover} onSelect={id => setSel(s => s===id?null:id)} />)}
        </main>
        <aside className="card side">
          <h3 className="serif">ความเคลื่อนไหวล่าสุด<small>{live?"กำลังอัปเดต":"หยุดชั่วคราว"}</small></h3>
          <ul className="feed">
            {feed.map(x => (
              <li key={x.id}>
                <span className="thumb">{React.createElement(ART[fleet],{paint:x.paint})}</span>
                <div><b>{x.kind==="in"?noun+"เข้า":x.kind==="out"?noun+"ออก":x.kind==="block"?noun+"จอดขวาง":"เคลียร์ทางเข้าแล้ว"}<em style={{color:x.kind==="in"?"var(--sage)":x.kind==="block"?"var(--warn)":"var(--ink3)"}}>{x.slot}</em></b><p>{x.meta}{x.at?" · "+x.at:""}</p></div>
              </li>
            ))}
          </ul>
        </aside>
      </div>
      </>}

      {page==="map" && canHover && tip && <Tip s={slots[tip.id]} rect={tip.rect} />}
      {page==="map" && !canHover && sel && <div className="card sheet" role="dialog" aria-label={"ช่อง "+sel}><Detail s={slots[sel]} onClose={() => setSel(null)} /></div>}
      <footer>ช่องจอดส่งสัญญาณปกติ {mine.length-faults} จาก {mine.length} ช่อง{faults?` พบความขัดข้อง ${faults} จุด`:""}{blocks?` · มีรถจอดขวางทางเข้า ${blocks} ช่อง (ช่องว่างตามเซนเซอร์ แต่เข้าจอดจริงไม่ได้)`:""} ตัวเลขทั้งหมดเป็นข้อมูลจำลอง</footer>
    </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
